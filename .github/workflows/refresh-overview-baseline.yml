name: Refresh Overview visual baseline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-overview-baseline.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore reviewed Overview snapshot from Browser QA
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "8794773081"
        run: |
          rm -rf /tmp/argrid-overview-baseline
          mkdir -p /tmp/argrid-overview-baseline
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/argrid-overview-baseline.zip
          unzip -q /tmp/argrid-overview-baseline.zip -d /tmp/argrid-overview-baseline
          source_file="$(find /tmp/argrid-overview-baseline -type f -name 'management-overview-1440x900-actual.png' | head -n 1)"
          test -n "$source_file"
          cp "$source_file" tests/e2e/visual.spec.ts-snapshots/management-overview-1440x900-chromium-linux.png

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate refreshed baseline
        run: |
          npm run check
          npm run qa:browser

      - name: Commit validated baseline and remove helper
        run: |
          git config user.name "ArGrid CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots/management-overview-1440x900-chromium-linux.png
          git rm .github/workflows/refresh-overview-baseline.yml
          git commit -m "Refresh Overview visual baseline"
          git push origin HEAD:main

      - name: Re-run final repository checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run quality.yml --ref main
          gh workflow run browser-qa.yml --ref main
          gh workflow run deploy-pages.yml --ref main
