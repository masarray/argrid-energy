name: Apply P0 public launch polish

on:
  push:
    branches:
      - polish/p0-public-launch
    paths:
      - .github/workflows/apply-p0-public-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v6
        with:
          ref: polish/p0-public-launch
          fetch-depth: 0

      - name: Apply Sankey and KPI hierarchy polish
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{label} anchor not found in {path}")
              path.write_text(text.replace(old, new, 1))

          sankey = Path("src/components/energy-flow-sankey.tsx")
          replace_once(
              sankey,
              '''                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="142" height={sourceNodeHeights[index]} rx="6" fill="var(--color-surface)" stroke="var(--color-border-strong)" />
                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="4" height={sourceNodeHeights[index]} rx="2" fill={item.color} />
                <text x="39" y={sourceNodes[index] - 4} fill="var(--color-muted-foreground)" fontSize="10" fontWeight="600">{item.name}</text>
                <text x="39" y={sourceNodes[index] + 13} fill="var(--color-foreground)" fontSize="12" fontWeight="600">{formatFlowValue(item.value, mode)}</text>''',
              '''                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="142" height={sourceNodeHeights[index]} rx="6" className="sankey-endpoint-card" />
                <rect x="28" y={sourceNodes[index] - sourceNodeHeights[index] / 2 + 1} width="137" height={sourceNodeHeights[index] - 2} rx="5" fill={item.color} className="sankey-endpoint-tint" />
                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="4" height={sourceNodeHeights[index]} rx="2" fill={item.color} />
                <text x="39" y={sourceNodes[index] - 4} className="sankey-endpoint-label" fontSize="10" fontWeight="600">{item.name}</text>
                <text x="39" y={sourceNodes[index] + 13} className="sankey-endpoint-value" fontSize="12" fontWeight="650">{formatFlowValue(item.value, mode)}</text>''',
              "source endpoint card",
          )
          replace_once(
              sankey,
              '''              <rect x="405" y="128" width="130" height="124" rx="8" fill="var(--color-surface)" stroke="var(--color-primary)" strokeOpacity="0.65" />
              <rect x="416" y="139" width="108" height="102" rx="5" fill="var(--color-primary)" fillOpacity="0.08" stroke="var(--color-border)" />
              <text x="470" y="176" textAnchor="middle" fill="var(--color-muted-foreground)" fontSize="8.5" fontWeight="700" letterSpacing="0.08em">{busLabel}</text>
              <text x="470" y="200" textAnchor="middle" fill="var(--color-foreground)" fontSize="17" fontWeight="650">{formatFlowValue(model.total, mode)}</text>
              <text x="470" y="220" textAnchor="middle" fill="var(--color-muted-foreground)" fontSize="9">20 kV busbar</text>''',
              '''              <rect x="405" y="128" width="130" height="124" rx="8" className="sankey-bus-shell" />
              <rect x="416" y="139" width="108" height="102" rx="5" className="sankey-bus-core" />
              <text x="470" y="176" textAnchor="middle" className="sankey-bus-label" fontSize="8.5" fontWeight="700" letterSpacing="0.08em">{busLabel}</text>
              <text x="470" y="200" textAnchor="middle" className="sankey-bus-value" fontSize="17" fontWeight="650">{formatFlowValue(model.total, mode)}</text>
              <text x="470" y="220" textAnchor="middle" className="sankey-bus-meta" fontSize="9">20 kV busbar</text>''',
              "distribution bus",
          )
          replace_once(
              sankey,
              '''                <rect x="744" y={consumerNodes[index] - 22} width="154" height="44" rx="6" fill="var(--color-surface)" stroke="var(--color-border-strong)" />
                <rect x="744" y={consumerNodes[index] - 22} width="4" height="44" rx="2" fill={item.color} />
                <text x="758" y={consumerNodes[index] - 3} fill="var(--color-muted-foreground)" fontSize="9.4" fontWeight="600">{item.name}</text>
                <text x="758" y={consumerNodes[index] + 13} fill="var(--color-foreground)" fontSize="11" fontWeight="600">{formatFlowValue(item.value, mode)}</text>''',
              '''                <rect x="744" y={consumerNodes[index] - 22} width="154" height="44" rx="6" className="sankey-endpoint-card" />
                <rect x="748" y={consumerNodes[index] - 21} width="149" height="42" rx="5" fill={item.color} className="sankey-endpoint-tint" />
                <rect x="744" y={consumerNodes[index] - 22} width="4" height="44" rx="2" fill={item.color} />
                <text x="758" y={consumerNodes[index] - 3} className="sankey-endpoint-label" fontSize="9.4" fontWeight="600">{item.name}</text>
                <text x="758" y={consumerNodes[index] + 13} className="sankey-endpoint-value" fontSize="11" fontWeight="650">{formatFlowValue(item.value, mode)}</text>''',
              "consumer endpoint card",
          )

          ui = Path("src/components/argrid-ui.tsx")
          replace_once(
              ui,
              '''  hint,
  tone = "neutral",
}: {
  label: string;
  value: string | number;
  unit?: string;
  trend?: number;
  hint?: string;
  tone?: "neutral" | "warning" | "critical" | "good";
}) {''',
              '''  hint,
  tone = "neutral",
  emphasis = "support",
  progress,
}: {
  label: string;
  value: string | number;
  unit?: string;
  trend?: number;
  hint?: string;
  tone?: "neutral" | "warning" | "critical" | "good";
  emphasis?: "primary" | "support";
  progress?: number;
}) {''',
              "KPI props",
          )
          replace_once(
              ui,
              '''    <section className={`kpi-tile ${toneClass}`} aria-label={`${label}: ${value}${unit ? ` ${unit}` : ""}. State ${stateLabel}${hint ? `. ${hint}` : ""}`}>
      <div className="flex items-center justify-between gap-2">''',
              '''    <section className={`kpi-tile kpi-emphasis-${emphasis} ${toneClass}`} aria-label={`${label}: ${value}${unit ? ` ${unit}` : ""}. State ${stateLabel}${hint ? `. ${hint}` : ""}${typeof progress === "number" ? `. ${Math.round(progress)} percent of reference` : ""}`}>
      <div className="flex items-center justify-between gap-2">''',
              "KPI section",
          )
          replace_once(
              ui,
              '''        <span className="font-display truncate text-[22px] font-medium leading-none tracking-[-0.035em] tabular">{value}</span>''',
              '''        <span className="kpi-value font-display truncate text-[22px] font-medium leading-none tracking-[-0.035em] tabular">{value}</span>''',
              "KPI value",
          )
          replace_once(
              ui,
              '''        {hint && <span className="truncate">{hint}</span>}
      </div>
    </section>''',
              '''        {hint && <span className="truncate">{hint}</span>}
      </div>
      {typeof progress === "number" && (
        <div className="kpi-progress-track" aria-hidden="true">
          <span style={{ width: `${Math.max(3, Math.min(100, progress))}%` }} />
        </div>
      )}
    </section>''',
              "KPI progress",
          )

          overview = Path("src/routes/index.tsx")
          replace_once(
              overview,
              '''          <KpiTile label="Active Power" value={telemetry.currentPower.toFixed(2)} unit="MW" trend={kpis.currentPowerTrend} hint="live site load" />
          <KpiTile label={`${periodLabel} Energy`} value={fmtNum(telemetry.todayEnergy)} unit="kWh" trend={kpis.todayEnergyTrend} hint={comparisonHint} />
          <KpiTile label="MTD Cost" value={fmtIDR(telemetry.todayCost * (timeRange === "This month" ? 1 : 25 / periodMultiplier))} trend={kpis.todayCostTrend} hint="forecast adjusted" />
          <KpiTile label="Demand Utilization" value={demandPct.toFixed(1)} unit="%" hint={`${telemetry.peakDemand.toFixed(2)} / ${telemetry.demandLimit.toFixed(1)} MW`} tone={demandPct > 92 ? "critical" : "warning"} />
          <KpiTile label="Verified Savings" value={fmtIDR(verifiedSavings)} trend={8.4} hint="year to date" tone="good" />
          <KpiTile label="Critical Alarms" value={kpis.criticalAlarms} hint={`${kpis.activeAlarms} active events`} tone={kpis.criticalAlarms > 0 ? "critical" : "neutral"} />''',
              '''          <KpiTile label="Active Power" value={telemetry.currentPower.toFixed(2)} unit="MW" trend={kpis.currentPowerTrend} hint="live site load" emphasis="primary" progress={(telemetry.currentPower / telemetry.demandLimit) * 100} />
          <KpiTile label="Demand Utilization" value={demandPct.toFixed(1)} unit="%" hint={`${telemetry.peakDemand.toFixed(2)} / ${telemetry.demandLimit.toFixed(1)} MW`} tone={demandPct > 92 ? "critical" : "warning"} emphasis="primary" progress={demandPct} />
          <KpiTile label="Verified Savings" value={fmtIDR(verifiedSavings)} trend={8.4} hint="year to date" tone="good" emphasis="primary" progress={(verifiedSavings / annualOpportunity) * 100} />
          <KpiTile label={`${periodLabel} Energy`} value={fmtNum(telemetry.todayEnergy)} unit="kWh" trend={kpis.todayEnergyTrend} hint={comparisonHint} />
          <KpiTile label="MTD Cost" value={fmtIDR(telemetry.todayCost * (timeRange === "This month" ? 1 : 25 / periodMultiplier))} trend={kpis.todayCostTrend} hint="forecast adjusted" />
          <KpiTile label="Critical Alarms" value={kpis.criticalAlarms} hint={`${kpis.activeAlarms} active events`} tone={kpis.criticalAlarms > 0 ? "critical" : "neutral"} />''',
              "Overview KPI hierarchy",
          )

          styles = Path("src/styles.css")
          marker = '''.workspace-management main {
  background:'''
          polish_css = '''/* Public-launch P0: enterprise Sankey hierarchy and decision-led KPI emphasis. */
.sankey-endpoint-card {
  fill: var(--surface);
  stroke: color-mix(in oklab, var(--foreground) 15%, var(--border));
  stroke-width: 0.9;
  filter: drop-shadow(0 2px 3px color-mix(in oklab, var(--foreground) 9%, transparent));
}

.sankey-endpoint-tint {
  opacity: 0.045;
  pointer-events: none;
}

.sankey-endpoint-label {
  fill: var(--muted-foreground);
}

.sankey-endpoint-value {
  fill: var(--foreground);
}

.sankey-bus-shell {
  fill: oklch(0.19 0.014 235);
  stroke: var(--primary);
  stroke-width: 1.1;
  filter: drop-shadow(0 5px 7px color-mix(in oklab, var(--foreground) 16%, transparent));
}

.sankey-bus-core {
  fill: color-mix(in oklab, var(--primary) 9%, oklch(0.19 0.014 235));
  stroke: color-mix(in oklab, var(--primary) 34%, oklch(0.3 0.01 235));
  stroke-width: 0.8;
}

.sankey-bus-label,
.sankey-bus-meta {
  fill: oklch(0.75 0.025 225);
}

.sankey-bus-value {
  fill: oklch(0.98 0.004 230);
}

.kpi-tile {
  --kpi-accent: var(--color-primary);
  transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
}

.kpi-warning {
  --kpi-accent: var(--color-amber);
}

.kpi-critical {
  --kpi-accent: var(--color-red);
}

.kpi-good {
  --kpi-accent: var(--color-green);
}

.kpi-emphasis-primary::after {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 2px;
  background: var(--kpi-accent);
}

.workspace-management .kpi-emphasis-primary {
  border-color: color-mix(in oklab, var(--kpi-accent) 28%, var(--border)) !important;
  background: linear-gradient(145deg, color-mix(in oklab, var(--kpi-accent) 5%, var(--surface)), var(--surface) 58%) !important;
  box-shadow:
    0 1px 2px color-mix(in oklab, var(--foreground) 5%, transparent),
    0 7px 18px color-mix(in oklab, var(--kpi-accent) 7%, transparent);
}

.workspace-management .kpi-emphasis-support {
  background: color-mix(in oklab, var(--surface) 92%, var(--surface-2)) !important;
}

.kpi-emphasis-primary .kpi-value {
  font-size: 23px;
}

.kpi-progress-track {
  position: absolute;
  inset: auto 0 0;
  height: 3px;
  overflow: hidden;
  background: color-mix(in oklab, var(--kpi-accent) 10%, transparent);
}

.kpi-progress-track > span {
  display: block;
  height: 100%;
  border-radius: 0 999px 999px 0;
  background: var(--kpi-accent);
  opacity: 0.82;
}

'''
          css_text = styles.read_text()
          if "sankey-endpoint-card" in css_text:
              raise SystemExit("P0 polish CSS already exists")
          if marker not in css_text:
              raise SystemExit("CSS insertion marker not found")
          styles.write_text(css_text.replace(marker, polish_css + marker, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh Overview visual baseline
        run: npm run test:e2e:update -- --project=chromium --grep "management overview"

      - name: Validate complete browser QA
        run: npm run qa:browser

      - name: Commit validated P0 polish
        run: |
          git diff --check
          git config user.name "ArGrid Public Polish"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/energy-flow-sankey.tsx src/components/argrid-ui.tsx src/routes/index.tsx src/styles.css tests/e2e/visual.spec.ts-snapshots/management-overview-1440x900-chromium-linux.png
          git rm .github/workflows/apply-p0-public-polish.yml
          git commit -m "Polish Sankey and KPI hierarchy for public launch"
          git push origin HEAD:polish/p0-public-launch
