name: Inspect ArGrid Browser QA Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print browser QA bootstrap errors
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: 30188258623
        run: |
          set -euo pipefail
          failed_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id' | head -n 1)"
          test -n "${failed_job}"
          echo "failed_job=${failed_job}"
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${failed_job}/logs" \
            | grep -E 'error TS|Error:|FAILED|failed|Received|Expected|scrollable|guided|Process completed|Assertion|Traceback|not found|toBeVisible|toEqual|browser QA|SyntaxError|IndentationError' \
            | tail -n 160 || true
