.workspace-state-critical .workspace-state-mark {
  background: var(--color-red);
}

.skeleton-block {
  overflow: hidden;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--color-surface-2) 20%, var(--color-surface-3) 40%, var(--color-surface-2) 60%);
  background-size: 200% 100%;
  animation: argrid-skeleton 1.4s ease-in-out infinite;
}

@keyframes argrid-skeleton {
  from { background-position: 100% 0; }
  to { background-position: -100% 0; }
}

@media (max-width: 1279px) {
  .shell-command-bar {
    min-height: 58px;
  }
}

@media (max-width: 640px) {
  .workspace-status {
    align-items: flex-start;
    padding-inline: 12px;
  }

  .workspace-state {
    flex-direction: column;
  }

  .workspace-state-mark {
    width: 44px;
    min-height: 3px;
  }
}

@media (forced-colors: active) {
  .kpi-state-dot,
  .workspace-state-mark {
    forced-color-adjust: none;
  }
}
