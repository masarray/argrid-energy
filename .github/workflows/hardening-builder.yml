          Path(".github/workflows/deploy-pages.yml").write_text(r'''name: Deploy ArGrid to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Type-check source
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify routes, assets, and Pages base
        run: npm run verify:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
''')

          Path("src/components/argrid-ui.tsx").write_text(r'''import type { ReactNode } from "react";

export function Panel({
  title,
  description,
  actions,
  children,
  className = "",
  padded = true,
  busy = false,
}: {
  title?: string;
  description?: string;
  actions?: ReactNode;
  children: ReactNode;
  className?: string;
  padded?: boolean;
  busy?: boolean;
}) {
  return (
    <section className={`panel flex min-w-0 flex-col overflow-hidden ${className}`} aria-busy={busy || undefined}>
      {(title || description || actions) && (
        <header className="panel-header flex min-h-10 items-start justify-between gap-3 border-b border-border px-4 py-2.5">
          <div className="min-w-0">
            {title && <h2 className="truncate text-[11.5px] font-semibold tracking-[-0.01em] text-foreground">{title}</h2>}
            {description && <p className="mt-0.5 text-[9.5px] leading-relaxed text-muted-foreground">{description}</p>}
          </div>
          {actions && <div className="flex shrink-0 items-center gap-1.5">{actions}</div>}
        </header>
      )}
      <div className={`min-h-0 flex-1 ${padded ? "p-4" : ""}`}>{children}</div>
    </section>
  );
}

export function KpiTile({
  label,
  value,
  unit,
  trend,
  hint,
  tone = "neutral",
}: {
  label: string;
  value: string | number;
  unit?: string;
  trend?: number;
  hint?: string;
  tone?: "neutral" | "warning" | "critical" | "good";
}) {
  const toneClass = {
    neutral: "kpi-neutral",
    warning: "kpi-warning",
    critical: "kpi-critical",
    good: "kpi-good",
  }[tone];
  const stateLabel = {
    neutral: "normal",
    warning: "warning",
    critical: "critical",
    good: "good",
  }[tone];

  return (
    <section className={`kpi-tile ${toneClass}`} aria-label={`${label}: ${value}${unit ? ` ${unit}` : ""}. State ${stateLabel}${hint ? `. ${hint}` : ""}`}>
      <div className="flex items-center justify-between gap-2">
        <div className="text-[9.5px] font-medium uppercase tracking-[0.11em] text-muted-foreground">{label}</div>
        <span className="kpi-state-dot" aria-hidden="true" />
      </div>
      <div className="mt-2 flex min-w-0 items-baseline gap-1.5">
        <span className="font-display truncate text-[22px] font-medium leading-none tracking-[-0.035em] tabular">{value}</span>
        {unit && <span className="shrink-0 text-[10.5px] text-muted-foreground">{unit}</span>}
      </div>
      <div className="mt-2 flex min-h-4 items-center gap-2 text-[9.5px] text-muted-foreground">
        {typeof trend === "number" && (
          <span className={`shrink-0 tabular ${trend < 0 ? "text-green" : trend > 0 ? "text-amber" : ""}`}>
            {trend > 0 ? "▲" : trend < 0 ? "▼" : "—"} {Math.abs(trend).toFixed(1)}%
          </span>
        )}
        {hint && <span className="truncate">{hint}</span>}
      </div>
    </section>
  );
}

export function WorkspaceState({
  eyebrow,
  title,
  description,
  action,
  tone = "neutral",
  compact = false,
}: {
  eyebrow?: string;
  title: string;
  description: string;
  action?: ReactNode;
  tone?: "neutral" | "warning" | "critical";
  compact?: boolean;
}) {
  const toneClass = tone === "critical" ? "workspace-state-critical" : tone === "warning" ? "workspace-state-warning" : "workspace-state-neutral";
  return (
    <section className={`workspace-state ${toneClass} ${compact ? "workspace-state-compact" : ""}`} role={tone === "critical" ? "alert" : "status"}>
      <span className="workspace-state-mark" aria-hidden="true" />
      <div className="min-w-0 flex-1">
        {eyebrow && <div className="text-[9px] font-semibold uppercase tracking-[0.14em] text-muted-foreground">{eyebrow}</div>}
        <h2 className="mt-1 text-[13px] font-semibold tracking-tight text-foreground">{title}</h2>
        <p className="mt-1 text-[10.5px] leading-relaxed text-muted-foreground">{description}</p>
      </div>
      {action && <div className="shrink-0">{action}</div>}
    </section>
  );
}

export function SkeletonBlock({ className = "h-20" }: { className?: string }) {
  return <div className={`skeleton-block ${className}`} aria-hidden="true" />;
}

export function SeverityDot({ level }: { level: "Critical" | "Warning" | "Info" | string }) {
  const c = level === "Critical" ? "bg-red" : level === "Warning" ? "bg-amber" : "bg-primary";
  return <span className={`mt-1 inline-block size-2 shrink-0 rounded-full ${c}`} aria-hidden="true" />;
}

export function StatusPill({ status }: { status: string }) {
  const map: Record<string, string> = {
    normal: "bg-green/10 text-green border-green/25",
    warning: "bg-amber/10 text-amber border-amber/30",
    critical: "bg-red/10 text-red border-red/30",
    Open: "bg-primary/10 text-primary border-primary/25",
    Assigned: "bg-violet/10 text-violet border-violet/25",
    Converted: "bg-green/10 text-green border-green/25",
    "In review": "bg-amber/10 text-amber border-amber/25",
    Validated: "bg-primary/10 text-primary border-primary/25",
    Approved: "bg-violet/10 text-violet border-violet/25",
    "In Progress": "bg-amber/10 text-amber border-amber/25",
    Implemented: "bg-primary/10 text-primary border-primary/25",
    Verification: "bg-amber/10 text-amber border-amber/25",
    "Verified Saving": "bg-green/10 text-green border-green/25",
    "Persistence Monitoring": "bg-green/10 text-green border-green/25",
  };
  const cls = map[status] || "bg-surface-2 text-muted-foreground border-border";
  return <span className={`inline-flex items-center rounded border px-1.5 py-0.5 text-[9px] font-medium uppercase tracking-[0.09em] ${cls}`}>{status}</span>;
}
''')

          Path("src/routes/__root.tsx").write_text(r'''import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
import { HeadContent, Link, Outlet, createRootRouteWithContext, useRouter } from "@tanstack/react-router";
import { useEffect } from "react";
import { WorkspaceState } from "@/components/argrid-ui";
import { DemoSimulationProvider } from "@/lib/demo-simulation";

function NotFoundComponent() {
  return (
    <div className="flex min-h-screen items-center justify-center bg-background px-4 py-10">
      <div className="w-full max-w-xl">
        <WorkspaceState
          eyebrow="Navigation"
          title="Workspace not found"
          description="The requested ArGrid route is not part of the current static demonstration. Return to the enterprise portfolio and continue from a governed workspace."
          action={<Link to="/portfolio" className="inline-flex h-9 items-center rounded-md bg-primary px-4 text-[11px] font-medium text-primary-foreground">Open portfolio</Link>}
        />
      </div>
    </div>
  );
}

function ErrorComponent({ error, reset }: { error: Error; reset: () => void }) {
  const router = useRouter();
  useEffect(() => console.error(error), [error]);

  return (
    <div className="flex min-h-screen items-center justify-center bg-background px-4 py-10">
      <div className="w-full max-w-xl">
        <WorkspaceState
          eyebrow="Client-side recovery"
          title="This workspace did not load"
          description="The local demo encountered an unexpected client-side error. Retry the route first; no field command, external filing, or financial posting occurred."
          tone="critical"
          action={
            <div className="flex flex-wrap gap-2">
              <button type="button" onClick={() => { router.invalidate(); reset(); }} className="inline-flex h-9 items-center rounded-md bg-primary px-4 text-[11px] font-medium text-primary-foreground">Retry workspace</button>
              <Link to="/portfolio" className="inline-flex h-9 items-center rounded-md border border-border bg-surface px-4 text-[11px] font-medium">Portfolio</Link>
            </div>
          }
        />
        <details className="mt-3 rounded-md border border-border bg-surface px-3 py-2 text-[10px] text-muted-foreground">
          <summary className="cursor-pointer font-medium text-foreground">Technical detail</summary>
          <pre className="mt-2 max-h-40 overflow-auto whitespace-pre-wrap font-mono text-[9px]">{error.message}</pre>
        </details>
      </div>
    </div>
  );
}

export const Route = createRootRouteWithContext<{ queryClient: QueryClient }>()({
  head: () => ({
    meta: [
      { title: "ArGrid Energy Management System" },
      { name: "description", content: "Open-source industrial energy management system demonstration." },
      { name: "author", content: "ArGrid open-source contributors" },
      { name: "theme-color", content: "#181c1f" },
      { property: "og:type", content: "website" },
    ],
  }),
  component: RootComponent,
  notFoundComponent: NotFoundComponent,
  errorComponent: ErrorComponent,
});

function RootComponent() {
  const { queryClient } = Route.useRouteContext();

  return (
    <QueryClientProvider client={queryClient}>
      <DemoSimulationProvider>
        <HeadContent />
        <Outlet />
      </DemoSimulationProvider>
    </QueryClientProvider>
  );
}
''')

