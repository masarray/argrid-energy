name: Bootstrap ArGrid Browser QA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-qa-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout browser QA branch
        uses: actions/checkout@v6
        with:
          ref: agent/browser-qa-visual-a11y-20260726
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate locked dependency graph
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      - name: Generate visual baselines
        run: npm run test:e2e:update

      - name: Validate complete browser QA suite
        run: npm run qa:browser

      - name: Commit validated lockfile and snapshots
        run: |
          git diff --check
          git config user.name "ArGrid Browser QA"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json tests/e2e/visual.spec.ts-snapshots
          git commit -m "Add validated browser QA lockfile and visual baselines"
          git push origin HEAD:agent/browser-qa-visual-a11y-20260726
