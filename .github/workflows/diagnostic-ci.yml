name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect-hardening-bootstrap:
    name: Inspect final hardening bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print final commit failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: 30180601532
        run: |
          set -euo pipefail
          failed_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id' | head -n 1)"
          test -n "${failed_job}"
          echo "failed_job=${failed_job}"
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${failed_job}/logs" \
            | tail -n 52
