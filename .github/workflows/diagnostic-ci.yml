name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-final-pages:
    name: Verify final hardened Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for final Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ec70233ecab9c17e49b72f17bb0b0c53abadcff1
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=40" --jq ".workflow_runs[] | select(.name == \"Deploy ArGrid to GitHub Pages\" and .head_sha == \"${EXPECTED_SHA}\") | .id" | head -n 1)"
            if [ -n "${run_id}" ]; then break; fi
            echo "Waiting for Pages run (${attempt}/40)"
            sleep 3
          done
          test -n "${run_id}"
          echo "run_id=${run_id}"
          for attempt in $(seq 1 100); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "pending"')"
            echo "status=${status} conclusion=${conclusion} (${attempt}/100)"
            if [ "${status}" = "completed" ]; then break; fi
            sleep 4
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '.jobs[] | [.id, .name, .status, (.conclusion // "pending")] | @tsv'
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "pending"')"
          test "${conclusion}" = "success"
