name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  inspect-main-failure:
    name: Inspect latest failed main run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract failing job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=failure&per_page=20" --jq '.workflow_runs[] | select(.name == "Deploy ArGrid to GitHub Pages") | .id' | head -n 1)"
          echo "latest_failed_run=${run_id}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '.jobs[] | [.id, .name, .conclusion] | @tsv'
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id' | head -n 1)"
          echo "failed_job=${job_id}"
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
            | grep -E 'src/|error TS|##\[error\]|npm ERR|Error:|ELIFECYCLE|Failed|✖' \
            | tail -n 120 || true

  prepare-fix:
    name: Validate and prepare portfolio typing fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply narrow typing correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/portfolio.tsx')
          text = path.read_text()
          old = 'const [selectedId, setSelectedId] = useState(siteId);'
          new = 'const [selectedId, setSelectedId] = useState<PortfolioSite["id"]>(siteId);'
          if old not in text:
              raise SystemExit('Expected portfolio selection declaration was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/routes/portfolio.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate fix
        run: npm run check

      - name: Push clean fix branch
        run: |
          git config user.name "ArGrid CI Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b fix/portfolio-selection-types-20260726
          git add src/routes/portfolio.tsx
          git commit -m "Fix portfolio site selection typing"
          git push origin HEAD:refs/heads/fix/portfolio-selection-types-20260726

  diagnose:
    name: Diagnose build and Pages packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint diagnostics
        run: npm run lint
      - name: TypeScript diagnostics
        run: npx tsc --noEmit
      - name: Vite bundle diagnostics
        run: npx vite build
      - name: Verify dist output
        run: test -f dist/index.html
      - name: Configure GitHub Pages diagnostics
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact diagnostics
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
