name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  diagnose:
    name: Diagnose build and Pages packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint diagnostics
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Vite bundle diagnostics
        id: bundle
        continue-on-error: true
        run: npx vite build

      - name: Verify dist output
        id: verify
        continue-on-error: true
        run: test -f dist/index.html

      - name: Configure GitHub Pages diagnostics
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact diagnostics
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Show diagnostic outcomes
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "bundle=${{ steps.bundle.outcome }}"
          echo "verify=${{ steps.verify.outcome }}"
          echo "configure=${{ steps.configure.outcome }}"
          echo "upload=${{ steps.upload.outcome }}"

      - name: Fail when a diagnostic failed
        if: >-
          steps.lint.outcome != 'success' ||
          steps.typecheck.outcome != 'success' ||
          steps.bundle.outcome != 'success' ||
          steps.verify.outcome != 'success' ||
          steps.configure.outcome != 'success' ||
          steps.upload.outcome != 'success'
        run: exit 1
