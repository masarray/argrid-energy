name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-main-pages-run:
    name: Verify latest main Pages run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the latest main deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 97aea5cbd8f43a5615767afad3dc6265f9324064
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=20" --jq ".workflow_runs[] | select(.name == \"Deploy ArGrid to GitHub Pages\" and .head_sha == \"${EXPECTED_SHA}\") | .id" | head -n 1)"
            if [ -n "${run_id}" ]; then break; fi
            echo "Waiting for run to appear (${attempt}/30)"
            sleep 5
          done
          test -n "${run_id}"
          echo "run_id=${run_id}"

          for attempt in $(seq 1 60); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "pending"')"
            echo "status=${status} conclusion=${conclusion} (${attempt}/60)"
            if [ "${status}" = "completed" ]; then break; fi
            sleep 5
          done

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '.jobs[] | [.id, .name, .status, (.conclusion // "pending")] | @tsv'

          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "pending"')"
          test "${conclusion}" = "success"
