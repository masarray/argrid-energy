name: Diagnostic CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  inspect-runs:
    name: Inspect recent Actions runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" \
            --jq '.workflow_runs[] | [.id, .name, .event, .status, (.conclusion // "pending"), .head_branch, .head_sha[0:7], .run_number] | @tsv'

  diagnose:
    name: Diagnose build and Pages packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint diagnostics
        run: npm run lint

      - name: TypeScript diagnostics
        run: npx tsc --noEmit

      - name: Vite bundle diagnostics
        run: npx vite build

      - name: Verify dist output
        run: test -f dist/index.html

      - name: Configure GitHub Pages diagnostics
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact diagnostics
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
