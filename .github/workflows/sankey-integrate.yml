name: Integrate ArGrid Energy Sankey

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sankey-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Sankey branch
        uses: actions/checkout@v6
        with:
          ref: feature/energy-sankey-20260731
          fetch-depth: 0

      - name: Integrate Sankey into Overview and browser coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          overview = Path("src/routes/index.tsx")
          text = overview.read_text()
          if 'import { EnergySankey } from "@/components/energy-sankey";' not in text:
              text = text.replace('import { AppShell } from "@/components/app-shell";', 'import { AppShell } from "@/components/app-shell";\nimport { EnergySankey } from "@/components/energy-sankey";')
          anchor = '        <div className="grid grid-cols-1 gap-3 xl:grid-cols-12">\n          <Panel title="Energy Balance"'
          panel = '''        <div className="grid grid-cols-1 gap-3 xl:grid-cols-12">
          <Panel title="Energy Flow Sankey" className="xl:col-span-12" actions={<Link to="/analytics" className="text-[10px] text-primary hover:underline">Open energy analytics →</Link>}>
            <EnergySankey
              siteName={site.name}
              currentPowerMW={telemetry.currentPower}
              gridMW={telemetry.gridImportMW}
              solarMW={telemetry.solarMW}
              generatorMW={telemetry.generatorMW}
              energyRateIDR={telemetry.energyRateIDR}
              meterQuality={telemetry.meterQuality}
              completenessPct={telemetry.intervalCompletenessPct}
              scenarioId={scenarioId}
            />
          </Panel>

          <Panel title="Energy Balance Detail"'''
          if "<EnergySankey" not in text:
              if anchor not in text:
                  raise SystemExit("Overview Energy Balance anchor not found")
              text = text.replace(anchor, panel, 1)
          overview.write_text(text)

          smoke = Path("tests/e2e/smoke.spec.ts")
          value = smoke.read_text()
          marker = '  test("guided demo advances across governed workspaces", async ({ page }) => {'
          test_case = '''  test("energy Sankey switches power cost and carbon views", async ({ page }) => {
    await prepareDemo(page, { scenario: "efficiency-loss" });
    await openWorkspace(page, "/");
    const sankey = page.getByRole("region", { name: "Energy Sankey diagram" });
    await expect(sankey).toBeVisible();
    await page.getByRole("button", { name: "Cost" }).click();
    await expect(sankey).toContainText("IDR");
    await page.getByRole("button", { name: "Carbon" }).click();
    await expect(sankey).toContainText("tCO2e/h");
  });

'''
          if "energy Sankey switches power cost and carbon views" not in value:
              value = value.replace(marker, test_case + marker)
          smoke.write_text(value)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate source and build
        run: npm run check

      - name: Refresh reviewed Overview baseline
        run: npm run test:e2e:update

      - name: Validate Chromium workflows
        run: npm run qa:browser -- --project=chromium

      - name: Commit validated integration
        run: |
          git diff --check
          git config user.name "ArGrid Sankey"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx tests/e2e/smoke.spec.ts tests/e2e/visual.spec.ts-snapshots
          git commit -m "Integrate Sankey into enterprise energy flow"
          git pull --rebase origin feature/energy-sankey-20260731
          git push origin HEAD:feature/energy-sankey-20260731
