name: ArGrid Browser QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Apply and validate P1 public polish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v6
        with:
          ref: polish/p1-command-panel-hierarchy
          fetch-depth: 0

      - name: Apply deterministic P1 patch
        run: python scripts/apply-p1-polish.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh reviewed Overview baseline
        run: npm run test:e2e:update -- --project=chromium --grep "management overview"

      - name: Run complete browser QA
        run: npm run qa:browser

      - name: Restore workflows and commit validated P1
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
          git show origin/main:.github/workflows/browser-qa.yml > .github/workflows/browser-qa.yml
          git rm scripts/apply-p1-polish.py
          git diff --check
          git config user.name "ArGrid P1 Polish"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/quality.yml .github/workflows/browser-qa.yml src/components/app-shell.tsx src/components/argrid-ui.tsx src/routes/index.tsx src/routes/portfolio.tsx src/styles.css tests/e2e/visual.spec.ts-snapshots/management-overview-1440x900-chromium-linux.png
          git commit -m "Polish command bar and panel hierarchy"
          git push origin HEAD:polish/p1-command-panel-hierarchy

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: argrid-p1-browser-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
