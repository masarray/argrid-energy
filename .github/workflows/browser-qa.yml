name: ArGrid Browser QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Apply and validate P3 release-detail polish
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout P3 branch
        uses: actions/checkout@v6
        with:
          ref: polish/p3-release-detail-finish
          fetch-depth: 0

      - name: Apply deterministic P3 patch
        run: python scripts/apply-p3-polish.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh reviewed P3 visual baselines
        run: npm run test:e2e:update -- --project=chromium

      - name: Run complete browser QA
        run: npm run qa:browser

      - name: Restore workflow and commit validated P3
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/browser-qa.yml > .github/workflows/browser-qa.yml
          git rm scripts/apply-p3-polish.py
          git diff --check
          git config user.name "ArGrid P3 Polish"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/browser-qa.yml src tests/e2e/smoke.spec.ts tests/e2e/visual.spec.ts-snapshots
          git commit -m "Polish typography tables and interaction details"
          git push origin HEAD:polish/p3-release-detail-finish

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: argrid-p3-browser-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
