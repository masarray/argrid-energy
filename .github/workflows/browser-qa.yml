name: ArGrid Browser QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Apply and validate P4 A4 document engine
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout P4 branch
        uses: actions/checkout@v6
        with:
          ref: polish/p4-public-release-hardening
          fetch-depth: 0

      - name: Apply deterministic P4 patch
        run: python scripts/apply-p4-a4-documents.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh reviewed visual baselines
        run: npm run test:e2e:update -- --project=chromium

      - name: Run complete browser QA
        run: npm run qa:browser

      - name: Restore workflow and commit validated P4
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/browser-qa.yml > .github/workflows/browser-qa.yml
          git rm scripts/apply-p4-a4-documents.py
          git diff --check
          git config user.name "ArGrid P4 Documents"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/browser-qa.yml src/components/a4-document-preview.tsx src/routes/reports.tsx src/routes/billing.tsx src/styles.css tests/e2e/smoke.spec.ts tests/e2e/visual.spec.ts-snapshots
          git commit -m "Add paginated A4 report and invoice preview"
          git push origin HEAD:polish/p4-public-release-hardening

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: argrid-p4-a4-documents-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
