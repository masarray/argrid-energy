name: Generate ArGrid Browser QA Baselines

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate lockfile, baselines, and validate browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate locked dependency graph
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      - name: Generate visual baselines
        run: npm run test:e2e:update

      - name: Validate complete browser QA suite
        run: npm run qa:browser

      - name: Upload generated lockfile and visual baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argrid-browser-qa-generated-${{ github.run_id }}
          path: |
            package-lock.json
            tests/e2e/visual.spec.ts-snapshots
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
