name: Integrate ArGrid Energy Flow Sankey

on:
  push:
    branches:
      - agent/energy-flow-sankey-20260731
    paths:
      - .github/workflows/apply-sankey-feature.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/energy-flow-sankey-20260731
          fetch-depth: 0

      - name: Integrate Sankey into enterprise overview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          text = text.replace(
              'import { ExportPdfButton } from "@/components/export-pdf-button";\n',
              'import { ExportPdfButton } from "@/components/export-pdf-button";\nimport { EnergyFlowSankey } from "@/components/energy-flow-sankey";\nimport { buildEnergyFlowSnapshot } from "@/lib/energy-flow";\n',
          )

          anchor = '''  const highConfidenceOpportunity =
    opportunities
      .filter((item) => item.confidence === "High")
      .reduce((sum, item) => sum + item.annualSaving, 0) * site.powerScale;
'''
          addition = anchor + '''
  const energyFlow = useMemo(
    () =>
      buildEnergyFlowSnapshot(
        {
          currentPower: telemetry.currentPower,
          gridImportMW: telemetry.gridImportMW,
          solarMW: telemetry.solarMW,
          generatorMW: telemetry.generatorMW,
          meterQuality: telemetry.meterQuality,
        },
        scenarioId,
      ),
    [scenarioId, telemetry.currentPower, telemetry.generatorMW, telemetry.gridImportMW, telemetry.meterQuality, telemetry.solarMW],
  );
'''
          if 'const energyFlow = useMemo(' not in text:
              text = text.replace(anchor, addition)

          pattern = re.compile(
              r'\n\s*<Panel title="Energy Balance".*?</Panel>\n\n\s*<Panel title="Demand & Cost Outlook"',
              re.S,
          )
          replacement = '''
          <Panel
            title="Energy Flow Sankey"
            className="xl:col-span-8"
            actions={
              <div className="flex items-center gap-3 text-[9.5px] text-muted-foreground">
                <span>hierarchy reconciled · simulated live flow</span>
                <Link to="/analytics" className="text-primary hover:underline">Analyze end use →</Link>
              </div>
            }
          >
            <EnergyFlowSankey snapshot={energyFlow} />
          </Panel>

          <Panel title="Demand & Cost Outlook"'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Energy Balance panel replacement did not match exactly once')

          text = text.replace('className="h-[348px] xl:col-span-4"', 'className="h-[430px] xl:col-span-4"', 1)
          text = text.replace('<div className="h-[205px]">', '<div className="h-[285px]">', 1)
          path.write_text(text)

          shell = Path('src/components/app-shell.tsx')
          shell_text = shell.read_text()
          marker = '  { label: "Cikarang Manufacturing Complex", detail: "Enterprise site · West Java", to: "/" },\n'
          item = marker + '  { label: "Energy Flow Sankey", detail: "Supply, end-use allocation, renewable share, and distribution losses", to: "/" },\n'
          if 'label: "Energy Flow Sankey"' not in shell_text:
              shell_text = shell_text.replace(marker, item)
          shell.write_text(shell_text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh reviewed Chromium baseline
        run: npm run test:e2e:update

      - name: Commit validated Sankey integration
        run: |
          rm .github/workflows/apply-sankey-feature.yml
          git diff --check
          git config user.name "ArGrid Product Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx src/components/app-shell.tsx tests/e2e/visual.spec.ts-snapshots .github/workflows/apply-sankey-feature.yml
          git commit -m "Add reconciled energy-flow Sankey to enterprise overview"
          git pull --rebase origin agent/energy-flow-sankey-20260731
          git push origin HEAD:agent/energy-flow-sankey-20260731
