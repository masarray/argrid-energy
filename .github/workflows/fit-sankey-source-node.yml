name: Fit Sankey source nodes to ribbon thickness

on:
  push:
    branches:
      - fix/sankey-source-node-fit
    paths:
      - .github/workflows/fit-sankey-source-node.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/sankey-source-node-fit
          fetch-depth: 0

      - name: Fit source cards to incoming ribbon thickness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/energy-flow-sankey.tsx")
          text = path.read_text()

          stack_line = "  const sourceStack = stackCenters(model.sourceItems, 141, 98);"
          height_line = "  const sourceNodeHeights = sourceStack.map(({ width }) => Math.max(50, Math.min(110, Math.ceil(width + 10))));"
          if height_line not in text:
              if stack_line not in text:
                  raise SystemExit("Source stack line was not found")
              text = text.replace(stack_line, f"{stack_line}\n{height_line}", 1)

          card_line = '                <rect x="24" y={sourceNodes[index] - 25} width="142" height="50" rx="6" fill="var(--color-surface)" stroke="var(--color-border-strong)" />'
          fitted_card_line = '                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="142" height={sourceNodeHeights[index]} rx="6" fill="var(--color-surface)" stroke="var(--color-border-strong)" />'
          accent_line = '                <rect x="24" y={sourceNodes[index] - 25} width="4" height="50" rx="2" fill={item.color} />'
          fitted_accent_line = '                <rect x="24" y={sourceNodes[index] - sourceNodeHeights[index] / 2} width="4" height={sourceNodeHeights[index]} rx="2" fill={item.color} />'

          if fitted_card_line not in text:
              if card_line not in text or accent_line not in text:
                  raise SystemExit("Source card lines were not found")
              text = text.replace(card_line, fitted_card_line, 1)
              text = text.replace(accent_line, fitted_accent_line, 1)

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate source and static build
        run: npm run check

      - name: Refresh reviewed Overview baseline
        run: npm run test:e2e:update -- --project=chromium --grep "management overview"

      - name: Validate complete browser QA
        run: npm run qa:browser

      - name: Commit validated Sankey geometry
        run: |
          git diff --check
          git config user.name "ArGrid Sankey Geometry"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/energy-flow-sankey.tsx tests/e2e/visual.spec.ts-snapshots/management-overview-1440x900-chromium-linux.png
          git rm .github/workflows/fit-sankey-source-node.yml
          git commit -m "Fit Sankey source cards to ribbon thickness"
          git push origin HEAD:fix/sankey-source-node-fit
